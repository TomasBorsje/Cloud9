apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vanilla-minecraft-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vanilla-minecraft-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vanilla-minecraft
  template:
    metadata:
      labels:
        app: vanilla-minecraft
    spec:
      containers:
        - name: vanilla-minecraft
          image: itzg/minecraft-server
          ports:
            - containerPort: 25565
          env:
            - name: EULA
              value: "TRUE"
            - name: DIFFICULTY
              value: "normal"
            - name: MEMORY # Should be 80% of container mem
              value: 2G
          resources:
            requests:
              memory: "2.5Gi"
              cpu: "1000m"
            limits:
              memory: "2.5Gi"
          volumeMounts:
            - mountPath: /data
              name: vanilla-minecraft-data
      volumes:
        - name: vanilla-minecraft-data
          persistentVolumeClaim:
            claimName: vanilla-minecraft-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: vanilla-minecraft-service
spec:
  type: NodePort
  selector:
    app: vanilla-minecraft
  ports:
    - protocol: TCP
      port: 25565
      targetPort: 25565
      nodePort: 30001
