apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vanilla-minecraft-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vanilla-minecraft-backups-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vanilla-minecraft-server
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: vanilla-minecraft
  template:
    metadata:
      labels:
        app: vanilla-minecraft
    spec:
      containers:
        - name: vanilla-minecraft
          image: itzg/minecraft-server
          ports:
            - containerPort: 25565
          env:
            - name: EULA
              value: "TRUE"
            - name: ICON
              value: "https://raw.githubusercontent.com/TomasBorsje/Cloud9/refs/heads/main/assets/vanilla-minecraft-server-icon.png"
            - name: OVERRIDE_ICON
              value: "true"
            # JVM Options
            # https://docker-minecraft-server.readthedocs.io/en/latest/configuration/jvm-options
            - name: MEMORY # Should be 80% of container mem
              value: 2G
            - name: USE_MEOWICE_FLAGS
              value: "true"
            # Server Properties
            # https://docker-minecraft-server.readthedocs.io/en/latest/configuration/server-properties/
            - name: DIFFICULTY
              value: "normal"
            - name: OPS
              value: |-
                Wingmann
            - name: WHITELIST
              value: |-
                Wingmann
            - name: SPAWN_PROTECTION
              value: "0"
            - name: MOTD
              value: "§e☀ Rebellion §aMinecraft§r - §fVanilla§r\n§7 * Well, there is a server here."
          resources:
            requests:
              memory: "2.5Gi"
              cpu: "1000m"
            limits:
              memory: "2.5Gi"
          volumeMounts:
            - mountPath: /data
              name: vanilla-minecraft-data
        - name: vanilla-minecraft-backups
          image: itzg/mc-backup
          #imagePullPolicy: Never
          securityContext:
            runAsUser: 1000
          env:
            - name: BACKUP_INTERVAL
              value: "24h"
          volumeMounts:
            - mountPath: /data
              name: vanilla-minecraft-data
              readOnly: true
            - mountPath: /backups
              name: vanilla-minecraft-backups
      volumes:
        - name: vanilla-minecraft-data
          persistentVolumeClaim:
            claimName: vanilla-minecraft-pvc
        - name: vanilla-minecraft-backups
          persistentVolumeClaim:
            claimName: vanilla-minecraft-backups-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: vanilla-minecraft-service
spec:
  type: NodePort
  selector:
    app: vanilla-minecraft
  ports:
    - protocol: TCP
      port: 25565
      targetPort: 25565
      nodePort: 30001
