apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gtnh-minecraft-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gtnh-minecraft-backups-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gtnh-minecraft-server
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: gtnh-minecraft
  template:
    metadata:
      labels:
        app: gtnh-minecraft
    spec:
      containers:
        - name: gtnh-minecraft
          image: itzg/minecraft-server
          ports:
            - containerPort: 25565
          env:
            # Server Type
            - name: TYPE
              value: "GTNH"
            - name: GTNH_PACK_VERSION
              value: "2.9.0"
            - name: EULA
              value: "TRUE"
            - name: ICON
              value: "https://raw.githubusercontent.com/TomasBorsje/Cloud9/refs/heads/main/assets/gtnh-server-icon.png"
            - name: OVERRIDE_ICON
              value: "true"
            # JVM Options
            # https://docker-minecraft-server.readthedocs.io/en/latest/configuration/jvm-options
            - name: MEMORY # Should be 80% of container mem
              value: 8G
            - name: USE_MEOWICE_FLAGS
              value: "true"
            # Server Properties
            # https://docker-minecraft-server.readthedocs.io/en/latest/configuration/server-properties/
            - name: DIFFICULTY
              value: "normal"
            - name: SEED
              value: "5639298997133918617"
            - name: LEVEL
              value: "TwoPointOhTwo"
            - name: OPS
              value: |-
                Wingmann
                Cyan727
                depression00
            - name: WHITELIST
              value: |-
                Wingmann
                Cyan727
                depression00
            - name: SPAWN_PROTECTION
              value: "0"
            - name: MOTD
              value: "§e☀ Rebellion §aMinecraft§r - §6GTNH§6\n§7 * Well, there is a server here."
          resources:
            requests:
              memory: "10Gi"
              cpu: "1000m"
          volumeMounts:
            - mountPath: /data
              name: gtnh-minecraft-data
        - name: gtnh-minecraft-backups
          image: itzg/mc-backup
          #imagePullPolicy: Never
          securityContext:
            runAsUser: 1000
          env:
            - name: BACKUP_INTERVAL
              value: "24h"
          volumeMounts:
            - mountPath: /data
              name: gtnh-minecraft-data
              readOnly: true
            - mountPath: /backups
              name: gtnh-minecraft-backups
      volumes:
        - name: gtnh-minecraft-data
          persistentVolumeClaim:
            claimName: gtnh-minecraft-pvc
        - name: gtnh-minecraft-backups
          persistentVolumeClaim:
            claimName: gtnh-minecraft-backups-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: gtnh-minecraft-service
spec:
  type: NodePort
  selector:
    app: gtnh-minecraft
  ports:
    - name: game
      protocol: TCP
      port: 25565
      targetPort: 25565
      nodePort: 30005
